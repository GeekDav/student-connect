services:
  db:
    image: postgres:16-alpine
    container_name: student-connect-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: studentconnect
    volumes:
      - student_connect_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d studentconnect"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  student_connect_pg:
